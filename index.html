<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1F2328">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI使用率">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>AI使用率</title>
<style>
  /* =============================================================
     AI残量ウィジェット スマホ版
     ・PCのウィジェットが送った数字を表示する(読むだけ)
     ・URLの「#k=合言葉」で、どのPCの数字を見るかを決める
     ============================================================= */
  :root {
    --bg: #1F2328; --card: #262B31; --text: #F0F3F6; --sub: #9AA4AE; --barbg: #3A4149;
    --green: #3FB950; --amber: #E3A53B; --red: #F85149;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);
    max-width: 560px; margin: 0 auto;
    -webkit-text-size-adjust: 100%;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  h1 { font-size: 20px; margin: 0; }
  .who { font-size: 13px; color: var(--sub); }
  .hint { font-size: 12px; color: var(--sub); margin: 0 0 14px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px 14px 12px; margin-bottom: 12px; }
  .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .name { font-size: 17px; font-weight: 700; }
  .plan {
    display: inline-block; font-size: 11px; font-weight: 600; color: var(--text);
    background: var(--barbg); border-radius: 6px; padding: 2px 7px; margin-top: 4px;
  }
  .age { font-size: 11px; color: var(--sub); font-weight: 400; margin-left: 6px; }
  .pct { font-size: 17px; font-weight: 700; white-space: nowrap; }
  .bar { height: 8px; border-radius: 4px; background: var(--barbg); margin: 8px 0 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 4px; }
  .detail { font-size: 13px; color: var(--sub); }
  .child { margin: 12px 0 0 14px; padding-top: 10px; border-top: 1px solid var(--barbg); }
  .child .name, .child .pct { font-size: 14px; }
  .child .bar { height: 6px; margin: 6px 0 4px; }
  footer { font-size: 12px; color: var(--sub); text-align: center; margin-top: 16px; line-height: 1.7; }
  button {
    font: inherit; font-size: 14px; color: var(--text); background: var(--barbg);
    border: 0; border-radius: 10px; padding: 10px 18px; margin-top: 8px;
  }
  .msg { background: var(--card); border-radius: 14px; padding: 18px; font-size: 14px; line-height: 1.8; }
  .warn { color: var(--amber); }
</style>
</head>
<body>
<header>
  <h1>AI使用率</h1>
  <span class="who" id="who"></span>
</header>
<p class="hint">数字は「使った割合」です。100%に近いほど残りが少なくなります。</p>
<main id="main"><div class="msg">読み込み中…</div></main>
<footer>
  <div id="sent"></div>
  <button id="reload" type="button">今すぐ更新</button>
</footer>

<script>
  // 保管場所(Supabase)の住所と、公開して問題ない読み取り用のキー
  const SUPABASE_URL = 'https://ydhgomtpbxqoagadvhfb.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_4jzbliUKZX86Dh7-l-HG_Q_pQEaIR-e';

  // どのPCの数字を見るかの合言葉。URLの「#k=…」から読む
  // (# 以降はサーバーに送られないので、ページの置き場所に合言葉が残らない)
  const readKey = new URLSearchParams(location.hash.slice(1)).get('k') || '';

  const main = document.getElementById('main');
  const now = () => Date.now() / 1000;

  function color(p) { return p >= 85 ? 'var(--red)' : p >= 60 ? 'var(--amber)' : 'var(--green)'; }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function clock(t) {
    const d = new Date(t * 1000), n = new Date();
    const hm = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
    return d.toDateString() === n.toDateString() ? hm : `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
  }

  function left(sec) {
    if (sec <= 0) return 'まもなく';
    const m = Math.ceil(sec / 60);
    if (m >= 1440) return `あと${Math.floor(m / 1440)}日${Math.floor((m % 1440) / 60)}時間`;
    if (m >= 60) return `あと${Math.floor(m / 60)}時間${m % 60}分`;
    return `あと${m}分`;
  }

  // 1時間以上前のデータなら「○時間前の記録」
  function age(t) {
    if (!t) return '';
    const m = Math.floor((now() - t) / 60);
    if (m < 60) return '';
    return m < 1440 ? `${Math.floor(m / 60)}時間前の記録` : `${Math.floor(m / 1440)}日前の記録`;
  }

  // 回復時刻を過ぎていれば0%として扱う(PCと同じ)
  function pctOf(w) { return w.resetAt && w.resetAt <= now() ? 0 : Math.max(0, Math.min(100, w.pct)); }

  function rowHTML(r, isChild) {
    const m = r.main;
    let right = '―', detail = esc(r.note), fill = '';
    if (m) {
      const p = pctOf(m);
      right = `<span style="color:${color(p)}">${esc(m.label)} ${Math.round(p)}%</span>`;
      fill = `<i style="width:${p > 0 ? Math.max(2, p) : 0}%;background:${color(p)}"></i>`;
      const parts = [];
      if (m.resetAt && p > 0) parts.push(`回復 ${clock(m.resetAt)}(${left(m.resetAt - now())})`);
      if (r.sub) parts.push(`${esc(r.sub.label)} ${Math.round(pctOf(r.sub))}%`);
      detail = parts.length ? parts.join(' · ') : '余裕あり';
    }
    const a = age(r.dataAt);
    return `<div class="${isChild ? 'child' : ''}">
      <div class="row-top">
        <span class="name">${isChild ? '└ ' : ''}${esc(r.name)}${a ? `<span class="age">${a}</span>` : ''}</span>
        <span class="pct">${right}</span>
      </div>
      ${!isChild ? `<div class="plan">プラン: ${r.plan ? esc(r.plan) : '不明(1回使うと表示)'}</div>` : ''}
      <div class="bar">${fill}</div>
      <div class="detail">${detail}</div>
    </div>`;
  }

  function render(board) {
    document.getElementById('who').textContent = board.label || '';
    const rows = (board.data && board.data.rows) || [];
    // 子の段(└ 週の枠・└ Argon)は、直前の親の段と同じカードに入れる
    let html = '', open = false;
    for (const r of rows) {
      if (r.child && open) { html += rowHTML(r, true); continue; }
      if (open) html += '</div>';
      html += '<div class="card">' + rowHTML(r, false);
      open = true;
    }
    if (open) html += '</div>';
    main.innerHTML = html || '<div class="msg">まだ数字が届いていません。PCでウィジェットを起動してください。</div>';

    const sentAt = board.updated_at ? Date.parse(board.updated_at) / 1000 : 0;
    const mins = sentAt ? Math.floor((now() - sentAt) / 60) : null;
    let s = sentAt ? `PCから最後に届いた時刻: ${clock(sentAt)}` : '';
    if (mins !== null && mins >= 10) s += `<br><span class="warn">PCから${mins >= 60 ? Math.floor(mins / 60) + '時間' : mins + '分'}届いていません(PCの電源が切れている可能性があります)</span>`;
    document.getElementById('sent').innerHTML = s;
  }

  async function load() {
    if (readKey.length < 20) {
      main.innerHTML = '<div class="msg">このページは、合言葉付きのアドレス(最後が「#k=…」)で開いてください。<br>アドレスはPCで作業したClaude Codeが案内します。</div>';
      return;
    }
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_usage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY },
        body: JSON.stringify({ p_read_key: readKey }),
        cache: 'no-store'
      });
      if (!res.ok) throw new Error(res.status);
      const list = await res.json();
      if (!list.length) {
        main.innerHTML = '<div class="msg">合言葉が正しくありません。アドレスを確認してください。</div>';
        return;
      }
      render(list[0]);
    } catch (e) {
      if (!main.querySelector('.card')) main.innerHTML = '<div class="msg">読み込めませんでした。電波の良いところで「今すぐ更新」を押してください。</div>';
    }
  }

  document.getElementById('reload').addEventListener('click', load);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  setInterval(load, 30000);
  load();
</script>
</body>
</html>
